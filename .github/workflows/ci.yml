name: CI

# Publishing is deliberately MANUAL (`npm publish` from a clean checkout), so
# there is no publish job here and no NPM_TOKEN secret on this repo. CI's job is
# to prove the tree is good; releasing is a human decision.
#
# A publish job that cannot authenticate is worse than none: it fails on every
# tag, and a workflow that is always red is a workflow nobody reads.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # GL is a hard requirement of the ABI, not an optional extra: a host that
      # cannot supply a WebGL2 context is non-conformant, and the GL tests
      # assert exactly that. webgl-node -> native-gles dlopens libEGL.so.1 and
      # libGLESv2.so.2, and needs a DRI driver behind them; a bare runner has
      # neither, so every GL test fails with "context could not be created".
      # Mesa's llvmpipe/swrast provides both in software - no GPU needed.
      - name: Install headless GL (Mesa software rasterizer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgles2 libgl1-mesa-dri libglvnd0
      - run: npm ci
      # Fail loudly here rather than as four confusing GL test failures: if the
      # runner cannot make a context, that is an environment problem, not a
      # regression in the host.
      - name: Verify a GL context is obtainable
        run: |
          node -e "
          import('webgl-node').then((m) => {
            // Mirror exactly what CartHost does, so this check cannot pass
            // while the host still fails.
            const gl = m.createWebGL2Context(64, 64)?.gl || null;
            if (!gl) { console.error('no WebGL2 context on this runner'); process.exit(1); }
            console.log('GL OK:', gl.getParameter(gl.VERSION));
          }).catch((e) => { console.error('GL import failed:', e.message); process.exit(1); });
          "
      - run: npm test

  pack-guard:
    name: npm pack (files field)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Guard the `files` field: the published tarball should be the runtime only
      # (no porting/, ports/, test/, logos). Fail loudly if it balloons.
      - name: npm pack dry-run
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          FILES=$(grep -c 'npm notice.*\.' pack.log || true)
          echo "packed entries: ~$FILES"
          if grep -qE 'ports/|porting/|test/fixtures|/obj/|\.o$|\.a$' pack.log; then
            echo "::error::npm pack would ship build artifacts / split-out dirs - check the files field"
            exit 1
          fi
